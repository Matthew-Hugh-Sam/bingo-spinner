<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bingo Spinner</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/",
        "cannon-es": "/vendor/cannon-es/cannon-es.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="hud">
    <header class="title">
      <h1>Bingo Spinner</h1>
      <p class="status" id="status" aria-live="polite">Loading…</p>
    </header>

    <aside class="drawn-panel">
      <span class="label">Last ball</span>
      <div class="big-ball empty" id="lastBall"><span>–</span></div>
      <div class="count"><strong id="drawnCount">0</strong> / 90 drawn</div>
      <ol class="history" id="history" aria-label="Previous balls, newest first"></ol>
    </aside>

    <footer class="controls">
      <button id="drawBtn" class="primary" title="Enter">Spin &amp; draw</button>
      <button id="crankBtn" title="Hold, or hold Space">Hold to crank</button>
      <label class="speed">
        Idle spin
        <input id="speed" type="range" min="0" max="3" step="0.1" value="0.6" />
      </label>
      <button id="shakeBtn">Shake</button>
      <button id="resetBtn" class="danger">New game</button>
    </footer>

    <p class="hint">
      Drag to look around · scroll to zoom · click a ball to flick it · hold Space to crank ·
      draws are picked by the server's secure random generator
    </p>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
